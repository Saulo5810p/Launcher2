// generated by 01_gradle_scaffold.py
plugins {
    id 'com.android.application' version '8.7.0'
}

android {
    // namespace define o pacote da classe R (o codigo importa com.android.launcher.R).
    // O ID instalavel do app e' o applicationId, que e' outro.
    namespace 'com.android.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xaulinxs.launcher2'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '4.0.1'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
